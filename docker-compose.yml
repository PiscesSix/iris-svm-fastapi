services:
  da1-iris-svm:
    build: .
    image: da1-iris-svm:latest
    container_name: da1-iris-svm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8000"       # chỉ nghe nội bộ, ra ngoài đi qua nginx
    mem_limit: 512m
    cpus: 0.5
    labels:
      com.myhoa.project: "da1"
      com.myhoa.description: "API SVM phan loai hoa Iris"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
