# Reverse proxy cho API Iris SVM (da1).
# Chép lên VPS: /etc/nginx/sites-available/da1-iris-svm
#   ln -s /etc/nginx/sites-available/da1-iris-svm /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d iris.iamaris.vip     # cấp chứng chỉ HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name iris.iamaris.vip;

    client_max_body_size 1m;

    access_log /var/log/nginx/da1-iris-svm.access.log;
    error_log  /var/log/nginx/da1-iris-svm.error.log;

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
